<!--
  Supabase → Authentication → Email Templates → Magic Link
  Paste the body below into the HTML editor. Subject: Your CFB Sicko code

  {{ .Token }} is the 6-digit code the app expects.
  {{ .ConfirmationURL }} stays below for Gmail/Apple.
  ProtonMail prefetches the confirm URL and burns it (otp_expired) — do not make the button the first thing.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0c1210;padding:32px 16px;font-family:Georgia,'Iowan Old Style',Palatino,serif;color:#e8efe6;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#141c18;border:1px solid #24302a;border-radius:10px;padding:28px 24px;">
        <tr>
          <td>
            <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#c8a24a;font-weight:700;">CFB Sicko</p>
            <p style="margin:0 0 6px;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#c8a24a;">Your code</p>
            <p style="margin:0 0 16px;font-size:40px;line-height:1.1;letter-spacing:0.12em;color:#e8efe6;font-weight:700;">{{ .Token }}</p>
            <p style="margin:0 0 12px;font-size:16px;line-height:1.5;color:#e8efe6;">Type this on cfbsicko.com. Do not tap the button if you use ProtonMail.</p>
            <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#8a9a8e;">Proton prefetches the link and burns the code. Gmail and Apple Mail can use the button below.</p>
            <p style="margin:0 0 8px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c8a24a;color:#1a1406;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:6px;">Confirm email</a>
            </p>
            <p style="margin:24px 0 0;font-size:13px;color:#8a9a8e;">If you did not request this, ignore it.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
