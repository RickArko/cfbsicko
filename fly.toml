app = "cfbsicko"
primary_region = "iad"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DATABASE_PATH = "/data/locks.db"
  DATABASE_TYPE = "sqlite"
  WEB_AUTH_ENABLED = "true"
  REQUIRE_EMAIL_CONFIRMED = "true"
  CFBSICKO_TRUST_PROXY_HEADERS = "true"
  PUBLIC_APP_URL = "https://cfbsicko.com"
  CFBSICKO_FRONTEND_DIST = "/app/frontend/dist"
  CFBSICKO_SEASON = "2026"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "cfbsicko --host 0.0.0.0 --port 8000"

[[mounts]]
  source = "cfbsicko_data"
  destination = "/data"
